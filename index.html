<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>グラブル便利ツール</title>
</head>
<body>
  <header class="app-header">
    <h1>グラブル便利ツール</h1>
  </header>

  <main>
    <!-- 素材トラッカー -->
    <div class="card">
      <h2>目標</h2>
      <form id="preset-form" class="inline-form">
        <select name="group" required aria-label="コンテンツ"></select>
        <select name="sub" hidden></select>
        <select name="preset" required disabled aria-label="プリセット"></select>
        <label class="count-label">×<input name="count" type="number" min="1" value="1" aria-label="追加する数"></label>
        <button type="submit">プリセットから追加</button>
      </form>
      <p class="hint" id="preset-info"></p>
      <details>
        <summary>自分で素材を指定して登録</summary>
        <form id="target-form">
        <div id="req-rows"></div>
        <div class="row-buttons">
          <button type="button" id="add-req-row">＋ 素材を追加</button>
          <button type="submit">目標を登録</button>
        </div>
        </form>
      </details>
      <div class="list-tools">
        <button type="button" id="open-all">すべて開く</button>
        <button type="button" id="close-all">すべて閉じる</button>
      </div>
      <div id="target-list"></div>
    </div>

    <details class="card" id="all-materials" data-key="all-materials">
      <summary><h2>全素材の合計</h2></summary>
      <p class="hint">未完了の目標すべての必要数を素材ごとに合計した一覧です。複数の目標で使う素材の不足はここで確認できます。「1周平均」を入れると、不足分を集めるのに必要な周回数の目安が出ます。</p>
      <form id="material-form" class="inline-form">
        <label class="field field-name">素材名<input name="name" placeholder="例: 〇〇の証" required></label>
        <label class="field">所持数<input name="owned" type="number" min="0" value="0"></label>
        <label class="field">1周あたり平均ドロップ<input name="perRun" type="number" min="0" step="0.01" placeholder="例: 1.5"></label>
        <button type="submit">素材を追加</button>
      </form>
      <div class="table-wrap">
        <table id="material-table">
          <thead>
            <tr>
              <th>素材</th><th>所持</th><th>必要</th><th>不足</th>
              <th>1周平均</th><th>目安周回</th><th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </details>

    <!-- バックアップ -->
    <details class="card" id="backup">
      <summary><h2>バックアップ</h2></summary>
      <p>データはこのブラウザ内（localStorage）にだけ保存されています。ブラウザのデータを消すと消えるので、定期的に書き出しておいてください。</p>
      <div class="row-buttons">
        <button id="export-btn">JSONを書き出す</button>
        <button type="button" id="import-btn">JSONを読み込む</button>
        <input type="file" id="import-file" accept="application/json" hidden>
        <button id="reset-btn" class="danger">全データを削除</button>
      </div>
    </details>
  </main>

  <footer class="app-footer">
    非公式のファンメイドツールです。株式会社Cygamesとは関係ありません。素材データの出典は各プリセットの「出典」リンクを参照してください。
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
