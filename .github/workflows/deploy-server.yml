# main に push されたら、同期サーバーの型チェックとテストを行い、通ったら Cloudflare Workers にデプロイする
name: 同期サーバーのデプロイ

on:
  push:
    branches: [main]
    # サーバーに関係するファイルが変わったときだけ動かす（画面や README だけを直したときに、同じサーバーをデプロイし直さないため）
    paths:
      - 'server/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch: # Actions の画面から手で実行もできるようにする

# このワークフローに与える権限。リポジトリを読むだけにする（Cloudflare へのデプロイには、下の鍵を使う）
permissions:
  contents: read

# デプロイが重なったら、新しいほうを待たせる（途中のデプロイを止めない）
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub の Settings → Environments で作った「cloudflare」という環境を使う
    # Cloudflare の鍵はこの環境にだけ置き、main ブランチからしか使えないようにしてある
    environment:
      name: cloudflare
      url: https://gbf-tracker-sync.syugo1142.workers.dev/api/hello
    steps:
      # リポジトリの中身を取り出す。版はタグではなくコミットの ID で固定する（タグは後から付け替えられるため）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # 型チェック → テスト → wrangler deploy（package.json の deploy）。途中で失敗したらデプロイしない
      # 鍵は、使うこの手順にだけ渡す（npm ci など、ほかの手順からは見えない）
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler が使い方のデータを Cloudflare に送らないようにする
          WRANGLER_SEND_METRICS: false
